plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.enigmadux.knotq"
    compileSdk 35

    defaultConfig {
        applicationId "com.enigmadux.knotq"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libjnidispatch.so", "**/libknotq_mobile_core.so"]
        }
    }
}

dependencies {
    implementation "net.java.dev.jna:jna:5.12.0@aar"
    implementation "androidx.annotation:annotation:1.9.1"
    // Google Play Billing for the sync subscription.
    implementation "com.android.billingclient:billing:7.1.1"
    // Periodic background sync while the app is backgrounded (the Android
    // counterpart of the iOS BGAppRefresh task).
    implementation "androidx.work:work-runtime:2.9.1"
}

tasks.register("buildRustDebug") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine "bash", "build-rust.sh", "debug"
        }
    }
}

preBuild.dependsOn("buildRustDebug")
