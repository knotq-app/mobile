plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Processes google-services.json so Firebase (Cloud Messaging) auto-initializes.
    id "com.google.gms.google-services"
}

// Release signing secrets live in keystore.properties (gitignored). When it is
// absent (e.g. a fresh checkout or CI without secrets) the release build falls
// back to unsigned so debug builds still work; a real Play release requires it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
def debugAbis = (project.findProperty("knotqDebugAbis") ?: "arm64-v8a,x86_64")
    .toString()
    .split(",")
    .collect { it.trim() }
    .findAll { it }
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.enigmadux.knotq"
    compileSdk 36

    defaultConfig {
        applicationId "com.enigmadux.knotq"
        minSdk 26
        targetSdk 36
        versionCode 24
        versionName "1.0.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Explicit sync backend override. Empty by default, in which case the
        // build-type-derived default applies (debug → sandbox, release → prod;
        // see AppConstants.defaultSyncApiBase). Set via
        // `-PknotqApiBase=https://sandbox.api.knotq.com` or the KNOTQ_API_BASE env
        // var at build time to pin a specific backend (e.g. a local Worker). Only
        // affects a NEW sign-in — existing sessions keep their stored apiBase.
        buildConfigField "String", "KNOTQ_API_BASE",
            "\"${project.findProperty('knotqApiBase') ?: System.getenv('KNOTQ_API_BASE') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            // Dev/sandbox builds ship the accounts/sync/billing surface.
            buildConfigField "boolean", "ACCOUNTS_ENABLED", "true"
            // Keep ordinary emulator APKs small and fast to install. Override
            // with `-PknotqDebugAbis=arm64-v8a,armeabi-v7a,x86,x86_64` when a
            // device-specific native ABI is required; release stays universal.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(debugAbis)
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Shipped Android builds include the account, sync, and subscription
            // surface, backed by the release Rust core below.
            buildConfigField "boolean", "ACCOUNTS_ENABLED", "true"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // The Rust core is built for four ABIs. Keeping every native debug symbol
    // inside the universal debug APK made ordinary emulator installs enormous
    // (hundreds of MB) and materially slowed cold process startup. Native
    // symbols are opt-in for the rare session that needs them; normal debug
    // builds use the same stripped native payload shape as release.
    if (project.findProperty("knotqKeepNativeSymbols")?.toString()?.toBoolean() == true) {
        packaging {
            jniLibs {
                keepDebugSymbols += ["**/libjnidispatch.so", "**/libknotq_mobile_core.so"]
            }
        }
    }
}

dependencies {
    // 5.15+ required: earlier AARs ship libjnidispatch.so without 16 KB page
    // alignment, which Play rejects for 16 KB page-size devices.
    implementation "net.java.dev.jna:jna:5.17.0@aar"
    implementation "androidx.annotation:annotation:1.9.1"
    // Account/sync-only libraries are packaged in every build variant now that
    // production Android builds ship the account surface too.
    implementation "com.android.billingclient:billing:8.3.0"
    // Google Play in-app review prompt.
    implementation "com.google.android.play:review:2.0.2"
    // Google Identity Services authorization (Identity.getAuthorizationClient).
    // Google blocks the loopback OAuth redirect on Android, so Calendar scopes
    // are granted through this instead of a browser flow.
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    // Periodic background sync while the app is backgrounded.
    implementation "androidx.work:work-runtime:2.9.1"
    // Firebase Cloud Messaging: silent data pushes wake the app to pull sync changes.
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

    testImplementation "junit:junit:4.13.2"
    // Keep one small connected smoke suite around the real Activity lifecycle.
    // The JVM tests cover pure scheduling/layout logic; this catches regressions
    // where async native startup never publishes a tree or a tab rebuild throws
    // only on a device/emulator.
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}

// Make timezone-matrix JVM tests real: Gradle's normal up-to-date checks do not
// consider the shell's TZ environment, so explicitly changing TZ otherwise
// reuses the previous test result. The property also sets the test JVM's zone.
tasks.withType(Test).configureEach {
    def testTimezone = project.findProperty("knotqTestTimezone")?.toString()
    if (testTimezone) {
        inputs.property("knotqTestTimezone", testTimezone)
        systemProperty "user.timezone", testTimezone
    }
}

// Cross-compile the Rust core (libknotq_mobile_core.so) into jniLibs before the
// native libs are merged. Debug and release use separate cargo profiles, wired
// per-variant so a release bundle ships the optimized .so — not the debug one.
tasks.register("buildRustDebug") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            environment "KNOTQ_DEBUG_ABIS", debugAbis.join(",")
            commandLine "bash", "build-rust.sh", "debug"
        }
    }
}

tasks.register("buildRustRelease") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine "bash", "build-rust.sh", "release"
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "mergeDebugNativeLibs") {
        task.dependsOn("buildRustDebug")
    }
    if (task.name == "mergeReleaseNativeLibs") {
        task.dependsOn("buildRustRelease")
    }
}
