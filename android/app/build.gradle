plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Processes google-services.json so Firebase (Cloud Messaging) auto-initializes.
    id "com.google.gms.google-services"
}

// Release signing secrets live in keystore.properties (gitignored). When it is
// absent (e.g. a fresh checkout or CI without secrets) the release build falls
// back to unsigned so debug builds still work; a real Play release requires it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.enigmadux.knotq"
    compileSdk 35

    defaultConfig {
        applicationId "com.enigmadux.knotq"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "1.0.5"

        // Explicit sync backend override. Empty by default, in which case the
        // build-type-derived default applies (debug → sandbox, release → prod;
        // see AppConstants.defaultSyncApiBase). Set via
        // `-PknotqApiBase=https://sandbox.api.knotq.com` or the KNOTQ_API_BASE env
        // var at build time to pin a specific backend (e.g. a local Worker). Only
        // affects a NEW sign-in — existing sessions keep their stored apiBase.
        buildConfigField "String", "KNOTQ_API_BASE",
            "\"${project.findProperty('knotqApiBase') ?: System.getenv('KNOTQ_API_BASE') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            // Dev/sandbox builds ship the accounts/sync/billing surface.
            buildConfigField "boolean", "ACCOUNTS_ENABLED", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Shipped builds compile out sign-in/sync/subscription; the sync UDL
            // fns stub in the (feature-off) Rust core and the Kotlin guards below
            // fall through to "Coming soon".
            buildConfigField "boolean", "ACCOUNTS_ENABLED", "false"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libjnidispatch.so", "**/libknotq_mobile_core.so"]
        }
    }
}

dependencies {
    // 5.15+ required: earlier AARs ship libjnidispatch.so without 16 KB page
    // alignment, which Play rejects for 16 KB page-size devices.
    implementation "net.java.dev.jna:jna:5.17.0@aar"
    implementation "androidx.annotation:annotation:1.9.1"
    // Account/sync-only libraries: compile all variants because the Kotlin partials
    // share declarations, but only package them in debug. Release has
    // ACCOUNTS_ENABLED=false plus R8 shrinking, so these guarded paths are removed.
    compileOnly "com.android.billingclient:billing:7.1.1"
    debugImplementation "com.android.billingclient:billing:7.1.1"
    // Google Play in-app review prompt.
    implementation "com.google.android.play:review:2.0.2"
    // Periodic background sync while the app is backgrounded.
    compileOnly "androidx.work:work-runtime:2.9.1"
    debugImplementation "androidx.work:work-runtime:2.9.1"
    // Firebase Cloud Messaging: silent data pushes wake the app to pull sync changes.
    compileOnly platform("com.google.firebase:firebase-bom:33.7.0")
    compileOnly "com.google.firebase:firebase-messaging"
    debugImplementation platform("com.google.firebase:firebase-bom:33.7.0")
    debugImplementation "com.google.firebase:firebase-messaging"

    testImplementation "junit:junit:4.13.2"
}

// Cross-compile the Rust core (libknotq_mobile_core.so) into jniLibs before the
// native libs are merged. Debug and release use separate cargo profiles, wired
// per-variant so a release bundle ships the optimized .so — not the debug one.
tasks.register("buildRustDebug") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine "bash", "build-rust.sh", "debug"
        }
    }
}

tasks.register("buildRustRelease") {
    doLast {
        exec {
            workingDir rootProject.projectDir
            commandLine "bash", "build-rust.sh", "release"
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "mergeDebugNativeLibs") {
        task.dependsOn("buildRustDebug")
    }
    if (task.name == "mergeReleaseNativeLibs") {
        task.dependsOn("buildRustRelease")
    }
}
