android.useAndroidX=true
# Give the Gradle/Kotlin daemon enough heap; release bundling OOM'd at the default.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
# AGP 8.7.3 was only validated up to compileSdk 35; we compile against 36 to meet
# Google Play's Aug 2026 targetSdk-36 requirement. The API surface is compatible,
# so silence the "untested compileSdk" warning rather than force an AGP upgrade.
android.suppressUnsupportedCompileSdk=36
