[package]
name = "knotq-mobile-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
knotq-commands.workspace = true
knotq-date-util.workspace = true
knotq-index.workspace = true
knotq-model.workspace = true
knotq-state.workspace = true
knotq-storage-json.workspace = true
thiserror.workspace = true
uniffi = "0.31.1"
uuid.workspace = true

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
