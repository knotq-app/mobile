[package]
name = "knotq-mobile-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]
# Compile-time gate for all accounts/sign-in/sync/billing/subscription behavior.
# OFF (default) = shipped/release builds: the sync UDL functions stub to safe
# no-ops. ON = dev/sandbox builds: full behavior as today. Flip via the build
# wiring (Debug xcconfig / android debug buildType) — see build-rust.sh + pbxproj.
accounts = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
knotq-commands.workspace = true
knotq-date-util.workspace = true
knotq-index.workspace = true
knotq-l10n.workspace = true
knotq-model.workspace = true
knotq-notifications.workspace = true
knotq-state.workspace = true
knotq-storage-json.workspace = true
knotq-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Persistent WebSocket sync transport (reuses knotq_sync::ws). rustls matches the
# TLS stack ureq already pulls in, so no second TLS implementation.
tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
uniffi = "0.31.1"
ureq.workspace = true
uuid.workspace = true

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
