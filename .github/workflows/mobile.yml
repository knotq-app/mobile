name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

# Every mobile job only checks out source and publishes no repository state.
# Keep the workflow token read-only even if repository defaults are changed.
permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-core:
    name: Mobile core (${{ matrix.tz }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Date semantics must not silently depend on the runner's default zone.
        tz: [UTC, America/New_York, America/Los_Angeles, Pacific/Auckland, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
      RUST_BACKTRACE: 1
      KNOTQ_FUZZ_SEEDS: 8
      KNOTQ_FUZZ_STEPS: 128
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        uses: ./app/.github/actions/linux-deps

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: app/mobile
          key: mobile-core-${{ matrix.tz }}

      - name: Check Rust formatting
        working-directory: app/mobile
        run: cargo fmt --all -- --check

      - name: Run mobile core tests and stateful fuzzers
        working-directory: app/mobile
        # The production tests and fuzzers live in the library target. Avoid
        # launching the zero-test timing binaries here; they are developer
        # benchmarks and a platform loader hang must not obscure core coverage.
        run: cargo test -p knotq-mobile-core --features accounts --release --lib -- --nocapture

  mobile-core-deep:
    name: Mobile core deep fuzz
    # The full profile is deliberately scheduled/manual: it exercises the
    # same production disk-backed/two-device fuzzers at a depth that is too
    # expensive to duplicate across every PR timezone shard.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
      RUST_BACKTRACE: 1
      KNOTQ_FUZZ_SEEDS: 16
      KNOTQ_FUZZ_STEPS: 256
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        uses: ./app/.github/actions/linux-deps

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: app/mobile
          key: mobile-core-deep

      - name: Check Rust formatting
        working-directory: app/mobile
        run: cargo fmt --all -- --check

      - name: Run deep mobile core stateful fuzzers
        working-directory: app/mobile
        run: cargo test -p knotq-mobile-core --features accounts --release --lib

  mobile-core-clippy:
    name: Mobile core Clippy (warnings as errors)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        uses: ./app/.github/actions/linux-deps

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: app/mobile
          key: mobile-core-clippy

      - name: Enforce mobile core Clippy cleanliness
        working-directory: app/mobile
        run: cargo clippy -p knotq-mobile-core --features accounts --all-targets -- -D warnings

  mobile-real-sync:
    name: Mobile core real WebSocket sync
    runs-on: ubuntu-24.04
    # This job supplies the URL that the real-transport test intentionally
    # requires. The ordinary mobile-core matrix remains deterministic and
    # offline; this job owns the live Wrangler/DO seam.
    env:
      TZ: UTC
      RUST_BACKTRACE: 1
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - name: Check out backend
        uses: actions/checkout@v6
        with:
          repository: knotq-app/backend
          path: app/backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      # The three sibling mobile-core jobs all do this and this one did not, so
      # it failed before it ran a single test: the keyring crate pulls in
      # `dbus-secret-service`, whose `libdbus-sys` build script panics outright
      # when `libdbus-1-dev` is absent ("explicit panic", exit 101).
      - name: Install Linux system dependencies
        uses: ./app/.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: app/mobile
          key: mobile-real-sync

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/backend/cloudflare/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/backend/cloudflare/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: app/backend/cloudflare
        run: pnpm install --frozen-lockfile

      - name: Run mobile core against local Wrangler WebSocket backend
        working-directory: app/mobile
        run: ./.github/scripts/run-mobile-ws-integration.sh

  ios:
    name: iOS tests (${{ matrix.tz }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the Swift/UIKit date path in the same zones as the Rust
        # core. This catches DST transitions and date-line rollovers that a
        # UTC-only simulator cannot expose.
        tz: [UTC, America/New_York, America/Los_Angeles, Pacific/Auckland, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
      RUST_BACKTRACE: 1
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Xcode build phase selects the simulator target from
          # CURRENT_ARCH; install every target it can legitimately request so
          # an arm64 hosted runner does not fail with E0463 before XCTest runs.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: app/mobile
          key: ios-tests

      - name: Select an installed iPhone simulator
        id: ios-simulator
        run: |
          set -euo pipefail
          # BSD awk differs across hosted macOS images for escaped grouping
          # parentheses. Parse the simulator line with portable grep/sed instead
          # so a toolchain update cannot leave the destination name empty.
          simulator_name="$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*([^()]*) \(.*/\1/' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test -n "$simulator_name"
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"

      - name: Run the complete iOS test target
        working-directory: app/mobile
        run: >-
          xcodebuild test
          -project ios/KnotQMobile.xcodeproj
          -scheme KnotQMobile
          -destination "platform=iOS Simulator,name=${{ steps.ios-simulator.outputs.name }}"
          -only-testing:KnotQMobileTests
          -parallel-testing-enabled NO

      # xcodebuild reports a host-app crash only as
      # "Crash: KnotQMobile (<pid>) <external symbol>", which names neither the
      # signal nor a single frame, so a crash-only failure is undiagnosable
      # from the job log. The simulator writes the real report to the host's
      # DiagnosticReports; summarise it rather than losing it with the runner.
      - name: Report the crash behind an iOS test failure
        if: failure()
        run: bash .github/scripts/ios-crash-report.sh
        working-directory: app/mobile

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package was removed from current
          # Android SDK repositories; platform-tools is installed below with
          # the API/NDK versions this build actually uses.
          packages: platform-tools

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate and regenerate Android localization
        working-directory: app
        run: |
          cargo run -p l10n-gen -- validate
          cargo run -p l10n-gen -- generate android
          git -C mobile diff --exit-code -- android/app/src/main/res android/app/src/main/kotlin/com/enigmadux/knotq/L10n.kt

      - name: Test and assemble Android debug and release builds
        working-directory: app/mobile
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --console=plain

      - name: Re-run Android JVM tests across timezone extremes
        working-directory: app/mobile
        run: |
          for tz in UTC America/New_York America/Los_Angeles Pacific/Auckland Asia/Kolkata; do
            echo "Testing Android formatters with TZ=$tz"
            TZ="$tz" ./android/gradlew -p android :app:testDebugUnitTest --no-daemon --console=plain -PknotqTestTimezone="$tz"
          done

  android-smoke:
    # Its own job so the emulator boots while the build/lint/release job is
    # still running: chained behind it, the two together were the slowest thing
    # in this workflow by a wide margin.
    name: Android connected smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out desktop/shared crates
        uses: actions/checkout@v6
        with:
          repository: knotq-app/knotq-app
          path: app

      - name: Check out mobile shells and core
        uses: actions/checkout@v6
        with:
          path: app/mobile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux Rust build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package was removed from current
          # Android SDK repositories; platform-tools is installed below with
          # the API/NDK versions this build actually uses.
          packages: platform-tools

      - name: Install Android build dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android emulator image for connected smoke coverage
        run: sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"

      # Without this the runner's /dev/kvm is only reachable by the `kvm`
      # group, the emulator starts with `-accel off`, and a fully software
      # emulated device takes 15 minutes to boot and stays slow enough
      # afterwards that the system ANR-kills the app the instrumentation is
      # trying to drive. Granting access brings the boot down to about a
      # minute. Harmless on a runner with no /dev/kvm: the rule simply never
      # matches and the emulator falls back as before.
      - name: Give the emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A cold AVD boot on a hosted runner took 15 minutes, and was paid again
      # on every re-run. Cache the device directory, and let the run below save
      # a boot snapshot into it, so later runs resume in about a minute instead
      # of booting from scratch. `force-avd-creation: false` keeps a restored
      # AVD rather than recreating (and re-booting) it.
      #
      # Restore and save are separate on purpose: `actions/cache` only saves
      # when the job succeeds, so while the smoke test is failing the snapshot
      # would never be cached and every debugging run would pay the cold boot
      # again. The snapshot is a property of the emulator image, not of whether
      # our test passed.
      - name: Restore the cached emulator AVD
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-35-google_apis-x86_64-pixel_2

      - name: Run connected Android startup/navigation smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # `reactivecircus/android-emulator-runner` splits `script` on
          # newlines and runs each line as its own `/usr/bin/sh -c`, which
          # is dash on Ubuntu: a multi-line script loses all shell state
          # between lines and `set -o pipefail` dies with "Illegal option
          # -o pipefail". Keep this to one line and let bash read the
          # whole smoke test from a file.
          script: bash app/mobile/.github/scripts/android-smoke.sh

      - name: Save the emulator AVD and its boot snapshot
        if: always() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-35-google_apis-x86_64-pixel_2
