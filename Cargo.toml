[workspace]
members = ["core"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }

knotq-commands = { path = "../desktop/commands" }
knotq-date-util = { path = "../desktop/date-util" }
knotq-index = { path = "../desktop/index" }
knotq-l10n = { path = "../shared/l10n" }
knotq-model = { path = "../shared/model" }
knotq-notifications = { path = "../desktop/notifications" }
knotq-rrule = { path = "../desktop/rrule" }
knotq-state = { path = "../desktop/state" }
knotq-storage-json = { path = "../desktop/storage-json" }
knotq-sync = { path = "../shared/sync" }

[profile.release]
lto = true
codegen-units = 1

# Android debug builds are installed and launched frequently on emulators. The
# default `dev` profile leaves native core libraries effectively unoptimized,
# which turns install, JNA loading, and first draw into a misleading performance
# test. Keep debug assertions and useful symbol names, but strip DWARF from the
# packaged libraries. Full native line tables are available from the unstripped
# Cargo artifacts; keeping them inside an emulator APK makes install/JNA startup
# disproportionately slow.
[profile.android-debug]
inherits = "dev"
opt-level = 1
debug = 1
strip = "debuginfo"
